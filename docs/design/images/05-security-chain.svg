<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1530" height="850" viewBox="0 0 1530 850">
<rect width="1530" height="850" fill="#ffffff"/>
<defs>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c64c8"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a3e"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d9480f"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c92a2a"/></marker>
</defs>
<g font-family="&quot;Noto Sans CJK TC&quot;,&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" fill="#212529" font-size="16">
<text x="32" y="45" font-size="26" text-anchor="start" font-weight="700">
<tspan x="32" dy="0">預設帳密的權限鏈（為什麼 bigred/bigred 只適合隔離環境）</tspan>
</text>
<rect x="32" y="66" width="16" height="16" rx="3" fill="#ffe3e3" stroke="#c92a2a"/>
<text x="56" y="80" font-size="13" text-anchor="start">
<tspan x="56" dy="0">預設帳密的權限風險</tspan>
</text>
<rect x="218" y="66" width="16" height="16" rx="3" fill="#e6f6ea" stroke="#2b8a3e"/>
<text x="242" y="80" font-size="13" text-anchor="start">
<tspan x="242" dy="0">緩解方式</tspan>
</text>
<rect x="40" y="145" width="390" height="145" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="235.0" y="210.6" font-size="16" text-anchor="middle">
<tspan x="235.0" dy="0">1</tspan>
<tspan x="235.0" dy="25">能連到任一節點 :30390 的人</tspan>
</text>
<rect x="535" y="145" width="390" height="145" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="730.0" y="198.1" font-size="16" text-anchor="middle">
<tspan x="730.0" dy="0">2</tspan>
<tspan x="730.0" dy="25">用預設帳密 bigred/bigred</tspan>
<tspan x="730.0" dy="25">登入 RDP</tspan>
</text>
<rect x="1030" y="145" width="460" height="145" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="1260.0" y="198.75" font-size="15" text-anchor="middle">
<tspan x="1260.0" dy="0">3 登入後就在 pod 內</tspan>
<tspan x="1260.0" dy="24">VSCodium、Integrated Browser 或本地 terminal</tspan>
<tspan x="1260.0" dy="24">都能存取叢集內網路（所有 ClusterIP Service）</tspan>
</text>
<path d="M 430 217 H 535" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrow-red)"/>
<path d="M 925 217 H 1030" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrow-red)"/>
<path d="M 1260 290 V 340 H 20 V 440 H 40" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrow-red)"/>
<rect x="40" y="370" width="390" height="145" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="235.0" y="435.6" font-size="16" text-anchor="middle">
<tspan x="235.0" dy="0">4 用 bigred/bigred SSH 到 tkadm</tspan>
<tspan x="235.0" dy="25">（VSCodium 會自動連線）</tspan>
</text>
<rect x="535" y="370" width="390" height="145" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="730.0" y="435.6" font-size="16" text-anchor="middle">
<tspan x="730.0" dy="0">5</tspan>
<tspan x="730.0" dy="25">tkadm 上的 kubectl</tspan>
</text>
<rect x="1030" y="370" width="390" height="145" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="1225.0" y="435.6" font-size="16" text-anchor="middle">
<tspan x="1225.0" dy="0">6</tspan>
<tspan x="1225.0" dy="25">控制整個叢集</tspan>
</text>
<path d="M 430 442 H 535" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrow-red)"/>
<path d="M 925 442 H 1030" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrow-red)"/>
<rect x="180" y="590" width="1100" height="205" rx="12" fill="#e6f6ea" stroke="#2b8a3e" stroke-width="2"/>
<text x="210" y="628" font-size="21" text-anchor="start" font-weight="700">
<tspan x="210" dy="0">緩解方式</tspan>
</text>
<text x="210" y="667" font-size="17" text-anchor="start">
<tspan x="210" dy="0">修改 users.txt 的密碼</tspan>
<tspan x="210" dy="32">需要隔離時一人一套 rdp-vscode + tkadm</tspan>
<tspan x="210" dy="32">tkadm 帳密為既有設定，非本專案新增</tspan>
</text>
</g>
</svg>
