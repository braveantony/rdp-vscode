<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1420" height="1100" viewBox="0 0 1420 1100">
<rect width="1420" height="1100" fill="#ffffff"/>
<defs>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c64c8"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a3e"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d9480f"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c92a2a"/></marker>
</defs>
<g font-family="&quot;Noto Sans CJK TC&quot;,&quot;Noto Sans TC&quot;,&quot;Microsoft JhengHei&quot;,&quot;PingFang TC&quot;,sans-serif" fill="#212529" font-size="16">
<text x="32" y="45" font-size="26" text-anchor="start" font-weight="700">
<tspan x="32" dy="0">Kustomize 部署結構</tspan>
</text>
<rect x="32" y="66" width="16" height="16" rx="3" fill="#fff4e0" stroke="#d9480f"/>
<text x="56" y="80" font-size="13" text-anchor="start">
<tspan x="56" dy="0">K8s 資源／部署設定</tspan>
</text>
<rect x="246" y="66" width="16" height="16" rx="3" fill="#ffe3e3" stroke="#c92a2a"/>
<text x="270" y="80" font-size="13" text-anchor="start">
<tspan x="270" dy="0">儲存前提</tspan>
</text>
<rect x="230" y="120" width="960" height="340" rx="12" fill="#fff4e0" stroke="#d9480f" stroke-width="2"/>
<text x="260" y="155" font-size="21" text-anchor="start" font-weight="700">
<tspan x="260" dy="0">manifests/base</tspan>
</text>
<text x="260" y="193" font-size="17" text-anchor="start">
<tspan x="260" dy="0">Namespace rdp-vscode</tspan>
<tspan x="260" dy="29">Deployment rdp-vscode：replicas 1、Recreate</tspan>
<tspan x="260" dy="29">requests 500m/1Gi；limits 4/4Gi</tspan>
<tspan x="260" dy="29">Service NodePort 30390 → 3389</tspan>
<tspan x="260" dy="29">env：MAX_SESSIONS=3、SSH_*、VSCODIUM_LOCALE</tspan>
<tspan x="260" dy="29">volumes：/dev/shm ← emptyDir（Memory 1Gi）</tspan>
<tspan x="260" dy="29">Secret rdp-vscode-users → /etc/rdp-vscode/users</tspan>
<tspan x="260" dy="29">ConfigMap rdp-vscode-ssh → /etc/rdp-vscode/ssh（optional）</tspan>
<tspan x="260" dy="29">base 不掛 /home</tspan>
</text>
<path d="M 450 460 V 515 H 335 V 565" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="100" y="505" font-size="15" text-anchor="start">
<tspan x="100" dy="0">resources: ../base</tspan>
</text>
<path d="M 980 460 V 565" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="1000" y="515" font-size="15" text-anchor="start">
<tspan x="1000" dy="0">resources: ../base</tspan>
</text>
<rect x="40" y="565" width="590" height="180" rx="12" fill="#fff4e0" stroke="#d9480f" stroke-width="2"/>
<text x="335.0" y="623.1" font-size="16" text-anchor="middle">
<tspan x="335.0" dy="0">manifests/stateless</tspan>
<tspan x="335.0" dy="25">/home ← emptyDir（Pod 重建即重置）</tspan>
<tspan x="335.0" dy="25">secretGenerator rdp-vscode-users（key users ← users.txt）</tspan>
<tspan x="335.0" dy="25">預設 bigred:bigred</tspan>
</text>
<rect x="710" y="565" width="670" height="210" rx="12" fill="#fff4e0" stroke="#d9480f" stroke-width="2"/>
<text x="1045.0" y="625.6" font-size="16" text-anchor="middle">
<tspan x="1045.0" dy="0">manifests/stateful</tspan>
<tspan x="1045.0" dy="25">/home ← PVC rdp-vscode-home</tspan>
<tspan x="1045.0" dy="25">5Gi、RWO</tspan>
<tspan x="1045.0" dy="25">不指定 storageClassName → 叢集預設 SC</tspan>
<tspan x="1045.0" dy="25">secretGenerator rdp-vscode-users（key users ← users.txt）</tspan>
</text>
<path d="M 335 745 V 900" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="355" y="830" font-size="15" text-anchor="start">
<tspan x="355" dy="0">resources: ../../stateless</tspan>
</text>
<rect x="40" y="900" width="590" height="140" rx="12" fill="#fff4e0" stroke="#d9480f" stroke-width="2"/>
<text x="335.0" y="950.6" font-size="16" text-anchor="middle">
<tspan x="335.0" dy="0">manifests/example/ssh-configmap</tspan>
<tspan x="335.0" dy="25">configMapGenerator rdp-vscode-ssh</tspan>
<tspan x="335.0" dy="25">key config</tspan>
</text>
<rect x="710" y="840" width="670" height="145" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="1045.0" y="905.6" font-size="16" text-anchor="middle">
<tspan x="1045.0" dy="0">需要預設 SC 為 WaitForFirstConsumer 或網路儲存。</tspan>
<tspan x="1045.0" dy="25">tk8s：local-path 已於 2026-10-28 重建為 WaitForFirstConsumer</tspan>
</text>
<path d="M 1045 775 V 840" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="7 5"/>
</g>
</svg>
