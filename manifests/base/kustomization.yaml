# Base: Namespace, Deployment and NodePort Service (30390). /home is not
# mounted here; pick an overlay: ../stateless (emptyDir) or ../stateful (PVC).
# The login accounts come from a Secret named rdp-vscode-users (key: users),
# generated by the overlay's secretGenerator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rdp-vscode
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
